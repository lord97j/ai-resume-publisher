name: Publish Resume Page

on:
  push:
    branches:
      - main
      - "jd/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Encrypt private resume
        id: encrypt
        run: |
          ENCRYPT_OUTPUT="$(npm run encrypt 2>&1)"
          echo "$ENCRYPT_OUTPUT"
          KEY="$(echo "$ENCRYPT_OUTPUT" | grep -oP 'key=\K[A-Za-z0-9_-]+')"
          echo "decrypt_key=${KEY}" >> "$GITHUB_OUTPUT"
      - name: Build static resume
        run: npm run build
      - name: Export timestamped PDF
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          VERSION="$(date -u +'%Y.%m.%d.%H%M')"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "RESUME_VERSION=${VERSION}-${SHORT_SHA}" >> "$GITHUB_ENV"
          npm run export:pdf -- --version "${VERSION}-${SHORT_SHA}"
          touch dist/.nojekyll
      - name: Resolve deploy target
        id: target
        run: |
          REF_NAME="${GITHUB_REF_NAME}"
          SAFE_REF="$(printf '%s' "$REF_NAME" | tr '/[:upper:]' '-[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//')"
          echo "safe_ref=${SAFE_REF}" >> "$GITHUB_OUTPUT"

          if [[ "$REF_NAME" == jd/* ]]; then
            JD_SLUG="${REF_NAME#jd/}"
            JD_SLUG="$(printf '%s' "$JD_SLUG" | tr '/[:upper:]' '-[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//')"
            PUBLIC_PATH="$(node -e "const fs = require('fs'); const resume = JSON.parse(fs.readFileSync('resume.json', 'utf8')); process.stdout.write(resume.publisher?.publishPath || '')")"
            PUBLIC_PATH="$(printf '%s' "$PUBLIC_PATH" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9/_-]#-#g; s#//*#/#g; s#^/##; s#/$##')"
            if [[ -z "$PUBLIC_PATH" ]]; then
              PUBLIC_PATH="jd/${JD_SLUG}"
            fi
            echo "is_jd=true" >> "$GITHUB_OUTPUT"
            echo "jd_slug=${JD_SLUG}" >> "$GITHUB_OUTPUT"
            echo "target_folder=${PUBLIC_PATH}" >> "$GITHUB_OUTPUT"
          else
            echo "is_jd=false" >> "$GITHUB_OUTPUT"
            echo "jd_slug=" >> "$GITHUB_OUTPUT"
            echo "target_folder=" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy main resume to gh-pages root
        if: steps.target.outputs.is_jd == 'false'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            p/**
            CNAME
      - name: Deploy JD resume to gh-pages subdirectory
        if: steps.target.outputs.is_jd == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: ${{ steps.target.outputs.target_folder }}
          clean: true
      - name: Create release with PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PDF_PATH="$(ls release/resume-*.pdf | head -n 1)"
          TAG="resume-${{ steps.target.outputs.safe_ref }}-${RESUME_VERSION}-${GITHUB_RUN_NUMBER}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          BASE_URL="https://${OWNER}.github.io/${REPO_NAME}/"
          NOTES="Automated resume PDF export for ${GITHUB_SHA}."
          NOTES="${NOTES}"$'\n\n'"**Resume URL**: ${BASE_URL}"
          if [[ "${{ steps.target.outputs.is_jd }}" == "true" ]]; then
            JD_URL="${BASE_URL}${{ steps.target.outputs.target_folder }}/"
            NOTES="${NOTES}"$'\n'"**JD Resume URL**: ${JD_URL}"
            NOTES="${NOTES}"$'\n'"**Decrypt URL**: ${JD_URL}#key=${{ steps.encrypt.outputs.decrypt_key }}"
          fi
          gh release create "$TAG" "$PDF_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Resume ${{ github.ref_name }} ${RESUME_VERSION}" \
            --notes "$NOTES"
      - name: Trigger main Pages deployment for JD branch
        if: steps.target.outputs.is_jd == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Print published paths
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          BASE_URL="https://${OWNER}.github.io/${REPO_NAME}/"
          echo "Main resume: ${BASE_URL}"
          if [[ "${{ steps.target.outputs.is_jd }}" == "true" ]]; then
            echo "JD resume: ${BASE_URL}${{ steps.target.outputs.target_folder }}/"
            echo "PDF release: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          else
            echo "PDF release: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          fi

  deploy-pages:
    if: github.ref_name == 'main'
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout aggregated gh-pages site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload aggregated Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
      - name: Deploy aggregated Pages site
        id: deployment
        uses: actions/deploy-pages@v4
